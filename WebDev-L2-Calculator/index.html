<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="keys">
      <button type="button" class="key fn" data-action="clear">C</button>
      <button type="button" class="key fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="key op" data-operator="÷" aria-label="Divide">÷</button>
      <button type="button" class="key op" data-operator="×" aria-label="Multiply">×</button>

      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key op" data-operator="−" aria-label="Subtract">−</button>

      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key op" data-operator="+" aria-label="Add">+</button>

      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key equals" data-action="equals" aria-label="Equals">=</button>

      <button type="button" class="key zero" data-digit="0">0</button>
      <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
